bundle:
  name: formula1-data-pipeline-analytics

include:
  - resources/*.yml

variables:
  catalog:
    description: Existing Unity Catalog catalog with permission to create the f1pa schemas.
  release_tag:
    default: v2026.14.0
  min_season:
    default: "1950"
  warehouse_id:
    description: Existing SQL warehouse for the AI/BI dashboard.

workspace:
  root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

sync:
  exclude:
    - sdp/**
    - local/**
    - tests/**
    - tools/**
    - docs/**
    - analysis/**
    - AGENTS.md
    - requirements-dev.txt
    - "**/__pycache__/**"

targets:
  dev:
    default: true
